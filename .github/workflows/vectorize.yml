name: Vectorize province contours

on:
  workflow_dispatch:
    inputs:
      source_png:
        description: "PNG file in repository root"
        required: true
        default: "fauxlore_map_KONTUR.png"

permissions:
  contents: read

jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pillow scipy rasterio

      - name: Vectorize contours
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/vectorize_provinces.py

      - name: Diagnose contour gaps (experimental)
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/diagnose_contour_gaps.py

      - name: Localize contour-change hotspots (experimental)
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/localize_contour_changes.py

      - name: Upload GeoJSON and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fauxlore-vectorization-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14
