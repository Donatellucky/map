name: Vectorize province contours

on:
  workflow_dispatch:
    inputs:
      source_png:
        description: "PNG file in repository root"
        required: true
        default: "fauxlore_map_KONTUR.png"

permissions:
  contents: read

jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pillow scipy rasterio shapely

      - name: Vectorize contours
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/vectorize_provinces.py

      - name: Validate polygon geometry and prepare release candidate
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/validate_polygon_release.py

      - name: Apply persistent province ID registry
        run: python scripts/apply_province_registry.py

      - name: Build fixed-grid GeoJSON tile prototype
        run: python scripts/build_geojson_tiles.py

      - name: Build read-only province topology and tile indexes
        run: python scripts/build_province_topology.py

      - name: Build raster contour adjacency candidates
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/build_raster_adjacency_candidates.py

      - name: Diagnose contour gaps (experimental)
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/diagnose_contour_gaps.py

      - name: Localize contour-change hotspots (experimental)
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/localize_contour_changes.py

      - name: Audit border and tiny components
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/audit_border_and_tiny_components.py

      - name: Audit largest polygonized regions
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/audit_large_regions.py

      - name: Audit merged sea component 6644
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/audit_component_6644_gap.py

      - name: Find minimal repair for component 6644
        env:
          SOURCE_PNG: ${{ github.workspace }}/${{ inputs.source_png }}
        run: python scripts/find_minimal_6644_repair.py

      - name: Upload GeoJSON and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fauxlore-vectorization-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 14
